name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: 빌드와 단위 테스트
        run: mvn -B -Dtest='!DbConnectionTest' -DfailIfNoTests=false package

  deploy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: 배포용 jar 만들기
        run: mvn -B -DskipTests package
      - name: 서버 접속 키 준비
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem
      - name: 새 jar 올리고 재시작, 실패하면 되돌리기
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no \
            target/sujuro-0.0.1-SNAPSHOT.jar ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/new.jar
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -e
          cd ~/app
          cp sujuro-0.0.1-SNAPSHOT.jar prev.jar || true
          mv new.jar sujuro-0.0.1-SNAPSHOT.jar
          sudo systemctl restart sujuro
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "배포 확인 완료 ($code)"
              exit 0
            fi
            sleep 3
          done
          echo "응답 없음, 이전 버전으로 되돌립니다"
          mv prev.jar sujuro-0.0.1-SNAPSHOT.jar
          sudo systemctl restart sujuro
          exit 1
          REMOTE