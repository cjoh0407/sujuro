# 공통 설정 (Git에 올림)
spring.profiles.active=local

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.ojj.sujuro
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# 세션 30분 미사용 시 자동 로그아웃 (NFR-003)
server.servlet.session.timeout=30m

# 나라장터 OpenAPI (조달청)
# 인증키는 Git에 올리지 않는다 (NFR-005). application-local.properties 에
# g2b.service-key=... 로 넣거나, 배포할 때는 환경변수 G2B_SERVICE_KEY 로 준다.
#
# 공공데이터포털이 주는 키는 이미 URL 인코딩된 문자열이다(%2B, %3D 포함).
# 쿼리스트링에 그대로 붙여야 하며, 다시 인코딩하면 인증이 깨진다.
#
# 아래는 일부러 기본값을 두지 않았다. 둘 다 없으면 이 값을 읽는 빈을 만들 때
# "Could not resolve placeholder 'G2B_SERVICE_KEY'" 로 바로 멈춘다.
# 기본값을 빈 문자열로 두면 앱이 그냥 뜬 뒤 첫 API 호출에서 인증 오류로 터져 원인을 찾기 어렵다.
g2b.service-key=${G2B_SERVICE_KEY}
g2b.base-url=https://apis.data.go.kr/1230000
# 서비스마다 경로가 다르다. base-url 만으로는 호출되지 않는다. (2026-10-20 실제 호출로 확인)
g2b.path.pre-spec=/ao/HrcspSsstndrdInfoService
g2b.path.bid=/ad/BidPublicInfoService
g2b.path.award=/as/ScsbidInfoService
# 인증키 파라미터 이름은 ServiceKey 다 (대문자 S).
#
# 조회구분(inqryDiv) 값의 뜻이 서비스마다 다르다. 번호로 조회할 때 쓰는 값만 적는다.
# 틀린 값을 넣으면 "필수값 입력 에러"가 오고 데이터가 오지 않는다. (2026-10-20 실제 호출로 확인)
#   사전규격  getPublicPrcureThngInfoServc      inqryDiv=2  + bfSpecRgstNo
#   입찰공고  getBidPblancListInfoServc         inqryDiv=2  + bidNtceNo
#   개찰결과  getOpengResultListInfoServc       inqryDiv=4  + bidNtceNo
#   참가업체  getOpengResultListInfoOpengCompt  inqryDiv=4  + bidNtceNo
#   최종낙찰  getScsbidListSttusServc           inqryDiv=4  + bidNtceNo
g2b.inqry-div.pre-spec=2
g2b.inqry-div.bid=2
g2b.inqry-div.award=4
g2b.connect-timeout=5s
g2b.read-timeout=10s

# 우리 회사 사업자등록번호(company.biz-no)는 application-local.properties 에 둔다.
# 개찰 결과에서 우리 회사 행을 찾는 기준이고, 공개 저장소에 올릴 값이 아니다.

# 공고 수집: 평일 오전 8시 10분 하루 1회 (문서 06 불러오기 주기)
g2b.collect.cron=0 10 8 * * MON-FRI
# [지금 불러오기] 를 연달아 누르지 못하게 막는 시간(분)
g2b.collect.manual-cooldown-minutes=5
