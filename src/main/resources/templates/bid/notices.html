<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<!--/*
  공고 관리 - 목록 (FR-017 ~ 020). UI 목업 v3.2 의 rNotices() 화면과 같은 구성이다.
  탭·검색·주관팀 필터·페이지 이동은 모두 GET 주소로 옮겨 다닌다. 목록은 항상 최신 등록 순이다. 그래서 주소를 그대로 북마크할 수 있다.
  공고명을 누르면 상세(/notices/{번호})로 간다. 영업부는 번호로 등록하고 [지금 수집] 을 누를 수 있다.
*/-->
<head>
  <title>공고 관리</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" th:href="@{/css/bid.css}">
  </th:block>
</head>
<body>

<h1 layout:fragment="pageTitle">공고 관리</h1>

<th:block layout:fragment="content">

  <!-- 11/05 H2 배치: 위 한 줄(왼쪽 검색·필터, 오른쪽 공고 등록·[지금 수집])과 목록 카드 머리의 밑줄 탭.
       등록·수집 결과는 위쪽 안내 블록 대신 오른쪽 아래 작은 알림으로 보여 준다 (scripts) -->
  <div class="search-row">
    <!-- 검색·필터. page 를 넘기지 않으므로 검색하면 1페이지부터 다시 본다. -->
    <form class="row" method="get" th:action="@{/notices}">
      <input type="hidden" name="stepCd" th:value="${search.stepCd}">
      <select name="searchBy" aria-label="검색 대상">
        <option value="name" th:selected="${search.searchBy == 'name'}">공고명</option>
        <option value="no" th:selected="${search.searchBy == 'no'}">공고번호</option>
        <option value="org" th:selected="${search.searchBy == 'org'}">수요기관</option>
      </select>
      <span class="sbox w-220px"><input type="text" name="keyword" th:value="${search.keyword}" placeholder="검색어" aria-label="검색어"><button class="sb-btn" type="submit" title="검색" aria-label="검색"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></span>
      <!--/* 주관팀 배정 필터 (11/06 정렬 드롭다운을 없애고 넣었다). 고르면 바로 걸러진다 */-->
      <select name="assign" data-change-submit aria-label="주관팀 배정 여부">
        <option value="">주관팀 전체</option>
        <option value="assigned" th:selected="${search.assign == 'assigned'}">주관팀 배정</option>
        <option value="unassigned" th:selected="${search.assign == 'unassigned'}">미배정</option>
      </select>
    </form>
    <!-- 영업부만: 공고 등록과 [지금 수집] -->
    <div class="nl-acts" sec:authorize="hasRole('SALES')">
      <!-- 공고 등록. 번호만 넣으면 나라장터 API로 내용을 가져온다. 키워드 검색은 없다. -->
      <!-- 형식(R + 연도 2자리 + BK·BD·DD + 숫자)만 보내기 전에 검사한다. 자릿수는 묻지 않는다(12자리 공고도 있을 수 있어서, 11/10).
           나라장터에 없는 번호는 서버가 "찾을 수 없습니다" 빨간 알림으로 -->
      <form class="row" method="post" th:action="@{/notices/register}" data-on-submit="checkPbancNo">
        <input type="text" name="pbancNo" th:value="${registNo}" maxlength="30" autocomplete="off" placeholder="공고번호 (예: R26BK01234567)" title="예) R26BK01234567 · R26BD01234567 · R26DD01234567" aria-label="등록할 공고번호" class="nl-regist" required>
        <button class="btn primary sm" type="submit">등록</button>
      </form>
      <!-- [지금 수집] (FR-025). 오후 5시 자동 수집과 같은 일을 지금 한다.
           나라장터를 여러 번 불러 수십 초 걸릴 수 있어, 누르면 버튼을 막고 '수집 중' 으로 바꾼다. -->
      <form method="post" th:action="@{/notices/collect}" data-collect-form>
        <!-- autocomplete="off": Firefox 가 새로고침 뒤에도 막아 둔(disabled) 상태를 기억하지 않게 한다 -->
        <button class="btn sm" type="submit" autocomplete="off">수집</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-head nl-head">
      <!-- 탭: 공고단계별 (11/03 진행상태 탭에서 바꿨다). 건수가 0인 단계도 보여 준다. 숫자는 검색어와 무관한 전체 건수다.
           11/05 목록 카드 머리의 밑줄 탭으로 옮겼다 -->
      <nav class="ntabs" aria-label="공고 단계">
        <a class="ntab" th:classappend="${search.stepCd == null} ? 'on' : ''"
           th:href="@{/notices(searchBy=${search.searchBy}, keyword=${search.keyword}, assign=${search.assign})}">전체<span class="n" th:text="${totalAll}">0</span></a>
        <a class="ntab" th:each="tab : ${tabs}"
           th:classappend="${tab.stepCd == search.stepCd} ? 'on' : ''"
           th:href="@{/notices(stepCd=${tab.stepCd}, searchBy=${search.searchBy}, keyword=${search.keyword}, assign=${search.assign})}"><th:block th:text="${tab.tabNm}">발주계획</th:block><span class="n" th:text="${tab.cnt}">0</span></a>
      </nav>
      <!-- 마지막 수집 (11/04 페이지 위에서 옮겼다). 건수는 아래 페이지 번호 줄 오른쪽에 있다 -->
      <div class="faint list-info">
        <span th:if="${lastRun}"
              th:text="|마지막 수집 ${#dates.format(lastRun.excnDt, 'MM-dd HH:mm')}|">마지막 수집 10-28 17:00</span>
        <span th:unless="${lastRun}">평일 오후 5시 자동 수집</span>
      </div>
    </div>

    <div class="ts notice-wrap">
      <!-- notice-table: 칸 너비를 고정한다 (bid.css). 값이 비어 있거나 탭·페이지가 바뀌어도 열 위치가 그대로다.
           남는 너비는 모든 열에 똑같이 나눈다. -->
      <table class="notice-table">
        <colgroup>
          <col class="w-sn"><col class="w-no"><col class="w-step"><col class="w-type"><col class="w-name">
          <col class="w-inst"><col class="w-ddln"><col class="w-bgt"><col class="w-team"><col class="w-prog">
        </colgroup>
        <thead>
          <tr>
            <th>번호</th>
            <th>공고번호</th>
            <th>단계구분</th>
            <th>공고종류</th>
            <th class="c-name">공고명</th>
            <th>수요기관</th>
            <th>마감일</th>
            <th>예산</th>
            <th>주관팀</th>
            <th>진행상태</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hv" th:each="row, st : ${result.rows}" data-row-link title="눌러서 공고 상세 보기">
            <!--/* 번호: 전체 누적 순번 (11/06). 1페이지 1~10, 2페이지 11~20. 옆의 공고번호는 나라장터 번호다.
                   상세 주소의 번호(PBANC_SN)는 DB 자동 번호라 건너뛸 수 있어 화면에 보여 주지 않는다 */-->
            <td class="mono faint" th:text="${result.rowNo(st.index)}">1</td>
            <td class="mono faint" th:text="${row.pbancNo}">R26BK00000000</td>
            <td>
              <!-- 입찰공고 전(발주계획·사전규격)은 회색. 색은 BidCode.stepPillClass 가 정한다. -->
              <span class="pill" th:classappend="${row.stepPillClass}"
                    th:text="${row.pbancStepNm}">입찰공고</span>
            </td>
            <td>
              <!-- 공고유형은 입찰공고 단계부터 생긴다. 그 앞 단계(발주계획·사전규격)에는 없으므로 '-' 로 둔다.
                   취소공고는 빨강, 변경공고는 주황으로 눈에 걸리게 한다. 색은 BidCode.pbancTypePillClass 가 정한다. -->
              <span class="pill" th:if="${row.pbancTypeNm}"
                    th:classappend="${row.pbancTypePillClass}" th:text="${row.pbancTypeNm}">일반공고</span>
              <span class="faint" th:unless="${row.pbancTypeNm}">-</span>
            </td>
            <td class="c-name" th:title="${row.pbancNm}">
              <!-- 공고명을 누르면 상세로 간다 (FR-026). 길면 한 줄로 말줄임(…)하고 마우스를 올리면 전체가 보인다 -->
              <a class="sl" th:href="@{/notices/{sn}(sn=${row.pbancSn})}">
                <th:block th:if="${row.pbancNm}" th:text="${row.pbancNm}">공고명</th:block>
                <span class="faint" th:unless="${row.pbancNm}">공고명 미수집</span>
              </a>
            </td>
            <!-- 수요기관 (11/03). 실수요기관이 없으면 발주기관 (BidNoticeMapper noticeColumns 의 instNm).
                 칸보다 길면 말줄임하고 마우스를 올리면 전체가 보인다 -->
            <td class="muted" th:text="${row.instNm ?: '-'}" th:title="${row.instNm}">수요기관</td>
            <!-- 단계별 마감 (사전규격 → 의견등록 마감, 입찰공고 → 제출 마감, 개찰·계약 → 지난 제출 마감, 발주계획 → '-').
                 날짜는 단계와 상관없이 모두 굵게 보인다 (11/03). 날짜만 보이고 어떤 마감인지는 마우스를 올리면 나온다. -->
            <td class="mono">
              <b th:if="${row.keyDdlnDt}" th:title="${row.keyDdlnNm}"
                 th:text="${#dates.format(row.keyDdlnDt, 'yyyy-MM-dd')}">0000-00-00</b>
              <b th:if="${row.keyDdlnDt == null and row.bidDdlnDt != null}" title="제출 마감"
                 th:text="${#dates.format(row.bidDdlnDt, 'yyyy-MM-dd')}">0000-00-00</b>
              <span class="faint" th:if="${row.keyDdlnDt == null and row.bidDdlnDt == null}">-</span>
            </td>
            <td class="mono" th:text="${row.budgetText}">0억</td>
            <!-- 주관팀 (11/03 담당 팀에서 바꿨다). 참여 팀은 제안팀 구성에서 정하고 공고 상세의 제안팀 카드에 나온다 -->
            <td th:title="${row.sprvsnTeamNm}">
              <th:block th:if="${row.sprvsnTeamNm}" th:text="${row.sprvsnTeamNm}">개발1팀</th:block>
              <span class="faint" th:unless="${row.sprvsnTeamNm}">미배정</span>
            </td>
            <td>
              <!-- 진행상태 (11/03): 배정 전 / 배정 완료 / 제안 작성 / 제안 제출 / 결과 등록 / 유찰 / 불참 중 하나 (BidCode.progressNm) -->
              <span class="pill" th:classappend="${row.progressPillClass}" th:text="${row.progressNm}">배정 전</span>
            </td>
          </tr>
          <tr th:if="${result.empty}">
            <td colspan="10" class="empty">조건에 맞는 공고가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 페이지 번호는 가운데, 건수는 맨 오른쪽 (11/04). 건수 글자는 위의 마지막 수집과 같은 모양이다 -->
    <div class="pager-row">
      <div class="pager">
        <a th:if="${result.hasPrev}" aria-label="이전 페이지"
           th:href="@{/notices(stepCd=${search.stepCd}, searchBy=${search.searchBy}, keyword=${search.keyword}, assign=${search.assign}, page=${result.page - 1})}">&laquo;</a>
        <span class="off" th:unless="${result.hasPrev}">&laquo;</span>

        <th:block th:each="p : ${#numbers.sequence(1, result.totalPages)}">
          <a th:classappend="${p == result.page} ? 'on' : ''" th:text="${p}"
             th:href="@{/notices(stepCd=${search.stepCd}, searchBy=${search.searchBy}, keyword=${search.keyword}, assign=${search.assign}, page=${p})}">1</a>
        </th:block>

        <a th:if="${result.hasNext}" aria-label="다음 페이지"
           th:href="@{/notices(stepCd=${search.stepCd}, searchBy=${search.searchBy}, keyword=${search.keyword}, assign=${search.assign}, page=${result.page + 1})}">&raquo;</a>
        <span class="off" th:unless="${result.hasNext}">&raquo;</span>
      </div>
      <span class="faint pager-info"
            th:text="|총 ${result.total}건 · ${result.page} / ${result.totalPages} 페이지|">총 0건</span>
    </div>
  </div>

</th:block>

<th:block layout:fragment="scripts">
  <script th:src="@{/js/notices.js}"></script>
  <!-- 등록·수집 결과는 오른쪽 아래 작은 알림으로 (common.js showToast). 실패(collectError)는 빨간 알림 -->
  <script th:if="${registMessage != null or collectMessage != null or collectError != null or registError != null}" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
      var ok = /*[[${registMessage ?: collectMessage}]]*/ null;
      var err = /*[[${collectError ?: registError}]]*/ null;
      if (!window.showToast) return;
      if (err) window.showToast(err, 'err');
      else if (ok) window.showToast(ok);
    });
  </script>
</th:block>

</body>
</html>
