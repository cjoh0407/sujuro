<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--/*
  사이드바 메뉴. 권한별 노출 기준은 HTML 목업 v3.5 와 같고(FR-009),
  같은 규칙이 SecurityConfig 의 URL 접근 규칙에도 들어 있다. 메뉴를 바꾸면 두 곳을 함께 고친다.
  권한: MGMT 경영지원실 / SALES 영업부 / LEADER 팀장 / MEMBER 팀원
*/-->
<aside class="sidebar" th:fragment="sidebar">
  <!--/* 로고는 11/06 멘토링에 따라 헤더(layout/default.html)로 옮겼다 */-->

  <nav class="nav" th:with="uri=${#httpServletRequest.requestURI}">
    <a th:href="@{/dashboard}" th:classappend="${#strings.startsWith(uri, '/dashboard')} ? 'on'">대시보드</a>
    <a sec:authorize="hasAnyRole('SALES','LEADER','MGMT')"
       th:href="@{/notices}" th:classappend="${#strings.startsWith(uri, '/notices')} ? 'on'">공고 관리</a>

    <div class="grp" sec:authorize="hasAnyRole('SALES','MGMT','LEADER','MEMBER')">제안 업무</div>
    <a sec:authorize="hasAnyRole('LEADER','MEMBER')"
       th:href="@{/proposal}" th:classappend="${#strings.startsWith(uri, '/proposal')} ? 'on'">스토리보드 관리</a>
    <a sec:authorize="hasAnyRole('LEADER','MEMBER')"
       th:href="@{/files}" th:classappend="${#strings.startsWith(uri, '/files')} ? 'on'">제안서 관리</a>
    <a sec:authorize="hasAnyRole('MGMT','LEADER','MEMBER')"
       th:href="@{/docs}" th:classappend="${#strings.startsWith(uri, '/docs')} ? 'on'">제출서류 · 조견표</a>
    <a sec:authorize="hasAnyRole('SALES','MGMT','LEADER','MEMBER')"
       th:href="@{/qa}" th:classappend="${#strings.startsWith(uri, '/qa')} ? 'on'">질의응답 기록</a>
    <a sec:authorize="hasAnyRole('LEADER','MEMBER')"
       th:href="@{/refs}" th:classappend="${#strings.startsWith(uri, '/refs')} ? 'on'">참고자료</a>

    <div class="grp">결과 · 운영</div>
    <!--/* 평가·결과 입력(/results)은 메뉴에서 뺐다 (11/04). 사업 이력 관리의 목록에서 들어가므로 그 화면에서는 사업 이력 관리에 불이 들어온다 */-->
    <a sec:authorize="hasAnyRole('MGMT','LEADER')"
       th:href="@{/bid-history}" th:classappend="${#strings.startsWith(uri, '/bid-history') or #strings.startsWith(uri, '/results')} ? 'on'">사업 이력 관리</a>
    <a th:href="@{/schedule}" th:classappend="${#strings.startsWith(uri, '/schedule')} ? 'on'">일정 관리</a>
    <a sec:authorize="hasRole('MGMT')"
       th:href="@{/users}" th:classappend="${#strings.startsWith(uri, '/users')} ? 'on'">사용자 관리</a>
  </nav>
</aside>
</body>
</html>
