<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  수주로 공통 레이아웃 (사이드바 + 상단바 + 내용 영역).
  로그인한 사용자 화면에서만 쓴다. (로그인 화면·오류 화면은 이 레이아웃을 쓰지 않는다.)

  새 화면 만드는 방법 - 아래 틀을 복사해서 내용만 바꾼다. 전체 예시는 templates/dashboard/index.html

    <html lang="ko"
          xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          layout:decorate="~{layout/default}">
    <head><title>공고 관리</title></head>
    <body>
      <h1 layout:fragment="pageTitle">공고 관리</h1>
      <th:block layout:fragment="content"> ... 화면 내용 ... </th:block>
      <th:block layout:fragment="scripts"> ... 이 화면에서만 쓰는 스크립트 ... </th:block>
    </body>
    </html>

  - 스타일은 static/css/common.css 의 클래스(.card, .btn, .pill, table ...)를 쓴다. 색을 직접 쓰지 않는다.
  - form은 th:action 을 써야 CSRF 토큰이 자동으로 들어간다.
  - 메뉴는 fragments/sidebar.html 에서 권한별로 보여 준다. 메뉴 주소(/notices, /files ...)는 SecurityConfig 의 URL 규칙과 같다.
*/-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <title layout:title-pattern="$CONTENT_TITLE - 수주로">수주로</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
  <th:block layout:fragment="head"></th:block>
</head>
<body>
<div class="app">

  <!-- 헤더는 화면 맨 위 가로 전체를 쓴다 (11/07). 왼쪽 로고 칸은 사이드바와 같은 너비라 메뉴 바로 위에 온다.
       그 아래 왼쪽은 사이드바, 오른쪽은 화면 내용 -->
  <header class="topbar">
    <!-- 왼쪽: 수주로 로고 칸(사이드바 너비, 누르면 대시보드) | 화면 제목 -->
    <div class="left">
      <a class="brand" th:href="@{/dashboard}" title="대시보드로">
        <svg class="brand-logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><path d="M46 14C22 8 18 29 32 32C46 35 42 56 18 50" fill="none" stroke="var(--logo-n)" stroke-width="8" stroke-linecap="round"/><circle cx="46" cy="14" r="6.5" fill="var(--logo-r)"/><circle cx="18" cy="50" r="6.5" fill="var(--logo-g)"/></svg>
        <b>수주로</b>
      </a>
      <h1 layout:fragment="pageTitle">수주로</h1>
    </div>
    <div class="right">
      <!-- 알림 종 아이콘: 누르면 알림 팝업이 열린다 (js/notification-panel.js). 따로 알림 화면은 없다.
           안 읽은 알림 건수(unreadCount)는 NotificationBadgeAdvice 가 모든 화면에 넣어 준다. (FR-032, FR-033) -->
      <button type="button" class="bellbtn" id="bellBtn" title="알림" aria-haspopup="dialog" aria-expanded="false"
              aria-controls="bellPanel" th:data-base="@{/alerts}"><svg class="bell-ico" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.8a4.6 4.6 0 0 0-4.6 4.6v2.7c0 .9-.3 1.8-.9 2.5l-.8 1a.9.9 0 0 0 .7 1.5h11.2a.9.9 0 0 0 .7-1.5l-.8-1a3.9 3.9 0 0 1-.9-2.5V7.4A4.6 4.6 0 0 0 10 2.8Z"/><path d="M8.2 16.4a1.9 1.9 0 0 0 3.6 0"/></svg><span class="badge" th:if="${unreadCount != null and unreadCount > 0}"
            th:text="${unreadCount > 99} ? '99+' : ${unreadCount}">3</span></button>
      <div class="bellpanel" id="bellPanel" role="dialog" aria-label="알림">
        <div class="bp-head">
          <b>알림</b><span class="faint" id="bpUnread"></span>
          <button type="button" class="link" id="bpReadAll">모두 읽음</button>
        </div>
        <ul class="bp-list" id="bpList"></ul>
        <div class="bp-foot faint" id="bpFoot">불러오는 중…</div>
      </div>
      <div class="who">
        <div>
          <b sec:authentication="principal.name">이름</b>
          <!--/* 영업부·경영지원실은 권한 이름과 소속 팀 이름이 같아 한 번만 보여 준다 (11/06). 팀장·팀원은 "팀장 · 공공사업1Div" */-->
          <span th:with="p=${#authentication.principal}"
                th:text="${p.team == null or p.team == p.roleLabel} ? ${p.roleLabel} : ${p.roleLabel + ' · ' + p.team}">권한 · 소속</span>
        </div>
      </div>
      <!-- 내 정보: 사람 아이콘을 누르면 팝업이 열린다 (js/me-panel.js). 따로 내 정보 화면은 없다. 비밀번호 변경은 /password/change -->
      <div class="mebox">
        <button type="button" class="btn sm hd-ico" id="meBtn" title="내 정보" aria-label="내 정보" aria-haspopup="dialog" aria-expanded="false" aria-controls="mePanel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-4 3.8-6.2 7.5-6.2s6.9 2.2 7.5 6.2"/></svg></button>
        <div class="mepanel" id="mePanel" role="dialog" aria-label="내 정보" th:with="p=${#authentication.principal}">
          <div class="me-head">
            <b th:text="${p.name}">이름</b>
            <span class="faint" th:text="${p.team == null or p.team == p.roleLabel} ? ${p.roleLabel} : ${p.roleLabel + ' · ' + p.team}">권한 · 소속</span>
          </div>
          <dl class="me-list">
            <div><dt>사번</dt><dd th:text="${p.empNo}">2022-0009</dd></div>
            <div><dt>소속</dt><dd th:text="${p.team ?: '-'}">소속</dd></div>
            <div><dt>직급</dt><dd th:text="${p.rank ?: '-'}">직급</dd></div>
            <div><dt>권한</dt><dd th:text="${p.roleLabel}">권한</dd></div>
          </dl>
          <div class="me-foot"><a class="btn primary" th:href="@{/password/change}">비밀번호 변경</a></div>
        </div>
      </div>
      <form class="logout-form" th:action="@{/logout}" method="post">
        <button class="btn sm hd-ico" type="submit" title="로그아웃" aria-label="로그아웃"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 19.5h3.5"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9.5"/></svg></button>
      </form>
    </div>
  </header>

  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <div class="main">

    <main class="content on">
      <th:block layout:fragment="content"></th:block>
    </main>
  </div>

</div>
<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/async-form.js}"></script>
<script th:src="@{/js/notification-socket.js}"></script>
<script th:src="@{/js/notification-panel.js}"></script>
<script th:src="@{/js/me-panel.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
