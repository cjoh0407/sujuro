<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 수주로</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
</head>
<body>
<div class="login">
  <div class="box">
    <div class="card">
      <div class="pad stack-16">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><path d="M46 14C22 8 18 29 32 32C46 35 42 56 18 50" fill="none" stroke="var(--logo-n)" stroke-width="8" stroke-linecap="round"/><circle cx="46" cy="14" r="6.5" fill="var(--logo-r)"/><circle cx="18" cy="50" r="6.5" fill="var(--logo-g)"/></svg>
          <div><b class="fs-19">수주로</b></div>
        </div>

        <div hidden data-flash="error" th:if="${param.error != null}">사번 또는 비밀번호가 올바르지 않습니다.</div>
        <div hidden data-flash="error" th:if="${param.locked != null}">비밀번호를 5번 틀려 계정이 잠겼습니다. 경영지원실에 잠금 해제를 요청해 주세요.</div>
        <div hidden data-flash="error" th:if="${param.disabled != null}">사용할 수 없는 계정입니다. 경영지원실에 문의해 주세요.</div>
        <div hidden data-flash="warn" th:if="${param.expired != null}">오래 사용하지 않아 로그아웃되었습니다. 다시 로그인해 주세요.</div>
        <div hidden data-flash="info" th:if="${param.logout != null}">로그아웃되었습니다.</div>
        <div hidden data-flash="warn" th:if="${param.changed != null}">계정 정보(권한·소속·비밀번호)가 바뀌어 로그아웃되었습니다. 다시 로그인해 주세요.</div>

        <form th:action="@{/login}" method="post" class="stack-12">
          <div class="fld">
            <label for="empNo">사번</label>
            <input id="empNo" name="empNo" type="text" autocomplete="username" autofocus required>
          </div>
          <div class="fld">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn primary jc-center" type="submit">로그인</button>
        </form>

      </div>
    </div>
  </div>
</div>
<!-- 안내는 오른쪽 아래 색 토스트로 (11/09, common.js) -->
<div id="toast" role="status" aria-live="polite"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
