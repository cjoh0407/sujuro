<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*
  제안 업무 화면 공통 머리 부분. 목차·요구사항, 제안서 파일, 제출서류, Q&A 화면에서 같이 쓴다.
  필요한 모델: bids(사업건 목록), bid(선택한 사업건), members(제안팀원, teamCard만), tab(있으면 유지)
              teamCard 편집용(주관팀 팀장만): canAssign, memTeams·memRanks(인원 찾기 팝업 필터). 참여팀은 인원을 넣고 빼면 자동으로 정해진다
    bidList(action)   : 사업건 목록(왼쪽 칸). action은 이 화면 주소 (예: '/proposal')
    bizHead           : 사업명 · 기관 · 공고번호 · 상태 (NFR-023: 어떤 사업건을 보고 있는지 항상 보이게)
    coPanel           : 외부 회사 입력(왼쪽 아래 칸, 주관팀 팀장만). 담당자 칸에서 "+ 외부 회사 직접 입력"을 고르면 열린다
    memPicker         : 제안팀 인원 추가(왼쪽 아래 칸, 주관팀 팀장만). 찾기·체크·추가를 한 칸에서 한다
    teamCard          : 제안팀 구성. 주관팀 팀장이면 인원 추가(찾기 팝업, 여러 명)·제외와 참여팀 지정도 한다 (FR-043~044)
*/-->
<body>

<!-- 사업건 목록 (왼쪽 칸). 눌러서 사업건을 바꾼다. 선택한 사업건은 강조. 탭이 있으면 유지 -->
<div class="card" th:fragment="bidList(action)">
  <div class="card-head">
    <h3>사업건 목록</h3>
    <span class="faint fs-11_5" th:text="${#lists.size(bids)} + '건'">3건</span>
  </div>
  <div class="bid-list">
    <th:block th:if="${!#lists.isEmpty(bids.?[!ended])}">
      <div class="bid-grp" th:if="${!#lists.isEmpty(bids.?[ended])}">진행 중</div>
      <div class="bid-body">
      <a class="bid-item" th:each="b : ${bids}" th:if="${!b.ended}" th:classappend="${b.pbancSn == bid.pbancSn} ? 'on'"
         th:href="${tab != null} ? @{${action}(bid=${b.pbancSn}, tab=${tab})} : @{${action}(bid=${b.pbancSn})}">
        <b th:text="${b.label}">사업건</b>
        <span class="pill neutral" th:text="${b.pbancSttsNm}">제안 작성 중</span>
      </a>
      </div>
    </th:block>
    <details class="bid-past" th:if="${!#lists.isEmpty(bids.?[ended])}">
      <summary class="bid-grp" th:text="'지난 사업 (' + ${#lists.size(bids.?[ended])} + ')'">지난 사업</summary>
      <div class="bid-body past-body">
      <a class="bid-item past" th:each="b : ${bids}" th:if="${b.ended}" th:classappend="${b.pbancSn == bid.pbancSn} ? 'on'"
         th:href="${tab != null} ? @{${action}(bid=${b.pbancSn}, tab=${tab})} : @{${action}(bid=${b.pbancSn})}">
        <b th:text="${b.label}">사업건</b>
        <span class="pill neutral" th:text="${b.pbancSttsNm}">결과 등록</span>
      </a>
      </div>
    </details>
  </div>
</div>

<!-- 사업건 고르기 (화면 오른쪽 위 드롭다운). 고르면 바로 그 사업건으로 바뀐다 (비동기). 탭이 있으면 유지 -->
<form th:fragment="bidSelect(action)" class="bid-select" method="get" th:action="@{${action}}">
  <input type="hidden" name="tab" th:if="${tab != null}" th:value="${tab}">
  <select name="bid" data-change-submit aria-label="사업건 고르기">
    <optgroup label="진행 중" th:if="${!#lists.isEmpty(bids.?[!ended])}">
      <option th:each="b : ${bids}" th:if="${!b.ended}" th:value="${b.pbancSn}" th:selected="${b.pbancSn == bid.pbancSn}"
              th:text="|${b.label} · ${b.pbancSttsNm}|">사업건 · 제안 작성 중</option>
    </optgroup>
    <optgroup label="지난 사업" th:if="${!#lists.isEmpty(bids.?[ended])}">
      <option th:each="b : ${bids}" th:if="${b.ended}" th:value="${b.pbancSn}" th:selected="${b.pbancSn == bid.pbancSn}"
              th:text="|${b.label} · ${b.pbancSttsNm}|">사업건 · 결과 등록</option>
    </optgroup>
  </select>
</form>

<!-- 사업명 줄 -->
<div class="biz" th:fragment="bizHead">
  <b th:text="${bid.label}">사업명</b>
  <span class="pill neutral" th:text="${bid.pbancSttsNm}">제안 작성 중</span>
</div>

<!-- 제안팀 구성. 팀장은 강조색. 주관팀 팀장이면 ✕로 빼고, 아래에서 인원 추가·참여팀 지정 (FR-043~044) -->
<div class="card" th:fragment="teamCard">
  <div class="card-head">
    <h3 th:text="'제안팀 구성 · 주관 ' + ${bid.sprvsnTeamNm ?: '미정'} + (${bid.ptcpTeamNms != null} ? ' · 참여 ' + ${bid.ptcpTeamNms} : '')">제안팀 구성</h3>
  </div>
  <div class="pad stack-12">
    <div class="mem-grid">
      <span class="pill mem-chip" th:each="m : ${members}" th:classappend="${m.leader} ? 'accent' : 'neutral'">
        <span class="mem-nm" th:title="${m.userNm + (m.teamNm != null ? ' · ' + m.teamNm : '') + m.stateMark}" th:text="${m.userNm + (m.teamNm != null ? ' · ' + m.teamNm : '') + m.stateMark}">이름 · 팀</span>
        <form th:if="${canAssign} and ${m.removable}" th:action="@{/proposal/team/member/remove}" method="post" class="d-inline"
              th:data-confirm="|「${m.userNm}」을(를) 제안팀에서 뺄까요?|">
          <input type="hidden" name="bid" th:value="${bid.pbancSn}">
          <input type="hidden" name="tab" th:value="${tab}">
          <input type="hidden" name="userId" th:value="${m.userId}">
          <button type="submit" class="x-btn" title="제안팀에서 빼기" aria-label="제안팀에서 빼기"><span class="ic ic-close"></span></button>
        </form>
      </span>
      <!-- 외부 회사: 목차 담당자로 적은 회사. ✕를 누르면 그 회사 이름을 지우고, 맡던 목차는 미지정이 된다 -->
      <span class="pill mem-chip mem-co" th:each="c : ${coNames}" th:if="${coNames != null}">
        <span class="mem-nm" th:title="${c + ' · 외부 회사'}" th:text="${c + ' · 외부'}">회사 · 외부</span>
        <form th:if="${canAssign}" th:action="@{/proposal/toc/co/delete}" method="post" class="d-inline"
              th:data-confirm="|「${c}」 회사를 지울까요? 그 회사가 맡은 목차는 모두 미지정이 됩니다.|">
          <input type="hidden" name="bid" th:value="${bid.pbancSn}">
          <input type="hidden" name="tab" th:value="${tab}">
          <input type="hidden" name="coNm" th:value="${c}">
          <button type="submit" class="x-btn" title="외부 회사 지우기" aria-label="외부 회사 지우기"><span class="ic ic-close"></span></button>
        </form>
      </span>
      <span class="faint" th:if="${#lists.isEmpty(members) and #lists.isEmpty(coNames)}">제안팀원이 없습니다.</span>
    </div>

  </div>

</div>

<!-- 제안팀 인원 추가 (FR-043 v4.0). 예전 팝업을 왼쪽 아래 칸으로 옮겼다. 후보는 /proposal/team/candidates에서 20명씩 받아 오고(스크롤하면 다음 20명),
     필터를 바꿔도 체크한 사람은 기억했다가 [선택한 인원 추가]에서 한 번에 보낸다 (proposal.js). 주관팀 팀장(canAssign)일 때만 부른다 -->
<div class="card" id="memPop" th:fragment="memPicker" th:data-bid="${bid.pbancSn}" th:data-url="@{/proposal/team/candidates}">
  <div class="card-head">
    <h3>제안팀 인원 추가</h3>
    <span class="faint fs-11_5">다른 팀 인원 포함</span>
  </div>
  <form th:action="@{/proposal/team/member/add}" method="post" class="pad mp-form" data-on-submit="checkMemPop">
    <input type="hidden" name="bid" th:value="${bid.pbancSn}">
    <input type="hidden" name="tab" th:value="${tab}">
    <div class="row">
      <select id="mp-team" data-on-change="reloadMemPop">
        <option value="">팀 전체</option>
        <option th:each="t : ${memTeams}" th:value="${t.teamSn}" th:text="${t.teamNm}">개발1팀</option>
      </select>
      <select id="mp-rank" data-on-change="reloadMemPop">
        <option value="">직급 전체</option>
        <option th:each="r : ${memRanks}" th:value="${r}" th:text="${r}">팀장</option>
      </select>
    </div>
    <input type="text" id="mp-q" placeholder="이름 검색" data-on-input="searchMemPop" autocomplete="off">
    <div class="ts mp-list" id="mp-list" onscroll="moreMemPop()">
      <table>
        <thead><tr><th class="w-30px"></th><th>이름</th><th>팀</th><th>직급</th></tr></thead>
        <tbody id="mp-body"></tbody>
      </table>
      <div class="mp-state faint" id="mp-state"></div>
    </div>
    <div id="mp-picked"></div>
    <div class="row jc-between">
      <span class="faint" id="mp-cnt">0명 선택</span>
      <span class="row">
        <button class="btn sm" type="button" data-on-click="clearMemPop">선택 해제</button>
        <button class="btn sm primary" type="submit">선택한 인원 추가</button>
      </span>
    </div>
  </form>
</div>

<!-- 외부 회사 입력 (왼쪽 아래 칸). 목차 담당자 칸에서 "+ 외부 회사 직접 입력"을 고르면 열리고, 그 목차의 담당 회사로 저장한다.
     외부 회사는 따로 저장하지 않고 목차에 연결해서만 남는다(TB_TOC.PIC_CO_NM). 주관팀 팀장(canAssign)일 때만 부른다 (proposal.js openCoPanel) -->
<div class="card" id="coPanel" th:fragment="coPanel" hidden>
  <div class="card-head">
    <h3>외부 회사 입력</h3>
  </div>
  <form th:action="@{/proposal/toc/assign}" method="post" class="pad mp-form">
    <input type="hidden" name="bid" th:value="${bid.pbancSn}">
    <input type="hidden" name="tab" th:value="${tab}">
    <input type="hidden" name="tocSn" id="coTocSn" value="">
    <div class="faint fs-11_5">담당 목차: <b id="coTarget" class="c-text"></b></div>
    <input type="text" name="picCoNm" id="coNmInput" placeholder="외부 회사명" maxlength="200" required autocomplete="off" list="co-names-left">
    <datalist id="co-names-left">
      <option th:each="c : ${coNames}" th:value="${c}"></option>
    </datalist>
    <div class="row jc-end">
      <button class="btn sm" type="button" data-on-click="cancelOwner">취소</button>
      <button class="btn sm primary" type="submit">지정</button>
    </div>
  </form>
</div>

</body>
</html>
