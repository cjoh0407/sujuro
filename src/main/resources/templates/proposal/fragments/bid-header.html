<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*
  제안 업무 화면 공통 머리 부분. 목차·요구사항, 제안서 파일, 제출서류, Q&A 화면에서 같이 쓴다.
  필요한 모델: bids(사업건 목록), bid(선택한 사업건), members(제안팀원, teamCard만), tab(있으면 유지)
    bidSelect(action) : 사업건 선택. action은 이 화면 주소 (예: '/proposal')
    bizHead           : 사업명 · 기관 · 공고번호 · 상태 (NFR-023: 어떤 사업건을 보고 있는지 항상 보이게)
    teamCard          : 제안팀 구성 (조회)
*/-->
<body>

<!-- 사업건 선택 -->
<div class="card pad" th:fragment="bidSelect(action)">
  <form th:action="@{${action}}" method="get" class="row">
    <label class="lbl" for="bidSel">사업건</label>
    <select id="bidSel" name="bid" onchange="this.form.submit()" style="min-width:320px">
      <option th:each="b : ${bids}" th:value="${b.pbancSn}" th:text="${b.label}"
              th:selected="${b.pbancSn == bid.pbancSn}">사업건</option>
    </select>
    <input type="hidden" name="tab" th:if="${tab != null}" th:value="${tab}">
  </form>
</div>

<!-- 사업명 줄 -->
<div class="biz" th:fragment="bizHead">
  <b th:text="${bid.label}">사업명</b>
  <span class="faint" th:text="${(bid.instNm ?: '-') + ' · ' + (bid.bidPbancNo ?: '-')}">기관 · 공고번호</span>
  <span class="pill neutral" th:text="${bid.pbancSttsNm}">제안 작성 중</span>
</div>

<!-- 제안팀 구성 (조회). 팀장은 강조색 -->
<div class="card" th:fragment="teamCard">
  <div class="card-head">
    <h3 th:text="'제안팀 구성 · 주관 ' + ${bid.sprvsnTeamNm ?: '미정'} + (${bid.ptcpTeamNms != null} ? ' · 참여 ' + ${bid.ptcpTeamNms} : '')">제안팀 구성</h3>
  </div>
  <div class="pad row">
    <span class="pill" th:each="m : ${members}" th:classappend="${m.leader} ? 'accent' : 'neutral'"
          th:text="${m.userNm + (m.teamNm != null ? ' · ' + m.teamNm : '')}">이름 · 팀</span>
    <span class="faint" th:if="${#lists.isEmpty(members)}">제안팀원이 없습니다.</span>
  </div>
</div>

</body>
</html>
