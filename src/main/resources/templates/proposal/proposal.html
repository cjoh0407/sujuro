<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<!--/*
  스토리보드 관리 (FR-046~056, FR-063, 화면 설계 v3.2)
  이 파일은 화면 뼈대만 둔다. 탭 내용은 tab-proposal.html / tab-summary.html,
  여러 곳에서 쓰는 조각은 fragments/ 아래(bid-header, toc, rqt)에 있다.
*/-->
<head>
  <title>스토리보드 관리</title>
  <th:block layout:fragment="head">
    <meta name="async-forms" content="on"><!-- 이 화면의 폼은 새로고침 없이 저장한다 (js/async-form.js) -->
    <link rel="stylesheet" th:href="@{/css/proposal.css}">
  </th:block>
</head>
<body>

<h1 layout:fragment="pageTitle">스토리보드 관리</h1>

<th:block layout:fragment="content">

  <!-- 참여 중인 사업건이 없으면 안내만 보여 준다 (FR-011: 사업건 제안팀만 열람) -->
  <div class="card" th:if="${#lists.isEmpty(bids)}">
    <div class="empty">참여 중인 제안 사업이 없습니다.</div>
  </div>

  <th:block th:unless="${#lists.isEmpty(bids)}">

    <div hidden data-flash="error" th:if="${error != null}" th:text="${error}">오류 안내</div>

    <!-- 사업명은 3:7 칸 위 왼쪽에 (사업 이력 관리와 같게). 그래서 왼쪽·오른쪽 칸이 같은 높이에서 시작한다 -->
    <th:block th:replace="~{proposal/fragments/bid-header :: bizHead}"></th:block>

    <!-- 3:7 화면: 왼쪽에 사업건 목록 · 인원 추가, 오른쪽에 업무 화면 -->
    <div class="split">
    <aside class="split-l">
      <th:block th:replace="~{proposal/fragments/bid-header :: bidList('/proposal')}"></th:block>
      <!-- 제안요약서 탭은 unmapView 를 넣지 않으므로(null) == true / != true 로 비교한다. 요구사항 추가 화면(미매핑)에서는 인원 추가 대신 요구사항 자동 추출 · 등록·수정 칸을 둔다 -->
      <th:block th:if="${canAssign and unmapView != true and extract == null}"><th:block th:replace="~{proposal/fragments/bid-header :: memPicker}"></th:block></th:block>
      <th:block th:if="${canAssign and unmapView != true and extract == null}"><th:block th:replace="~{proposal/fragments/bid-header :: coPanel}"></th:block></th:block>
      <th:block th:if="${canReq and unmapView == true}"><th:block th:replace="~{proposal/fragments/rqt :: rqExtract}"></th:block></th:block>
      <th:block th:if="${canReq and unmapView == true}"><th:block th:replace="~{proposal/fragments/rqt :: rqForm}"></th:block></th:block>
    </aside>
    <div class="split-r">
    <th:block th:replace="~{proposal/fragments/bid-header :: teamCard}"></th:block>

    <!-- 공고 첨부파일 (11/11): 공고 상세의 첨부(제안요청서 등). 제안요청서가 맨 위. 누르면 내려받는다. 첨부가 없어도 카드는 보이고 안내만 나온다 -->
    <div class="card">
      <div class="card-head">
        <h3>공고 첨부파일</h3>
        <span class="faint fs-11_5" th:text="${#lists.size(noticeFiles)} + '건'">2건</span>
      </div>
      <div class="empty" th:if="${#lists.isEmpty(noticeFiles)}">첨부파일 정보가 아직 없습니다. 공고를 수집할 때 다시 받아 봅니다.</div>
      <!-- 대표 1개(제안요청서가 맨 앞)만 보이고, 나머지는 접어 둔다. 기본은 접힘 (11/12) -->
      <div class="nf-list" th:unless="${#lists.isEmpty(noticeFiles)}">
        <a class="nf-item" th:each="f, st : ${noticeFiles}" th:if="${st.first}" title="눌러서 내려받기"
           th:href="@{/proposal/notice-file/{fs}(fs=${f.fileSn}, bid=${bid.pbancSn})}">
          <span class="nf-nm" th:text="${f.orgnlFileNm}">[제안요청서] 사업.hwpx</span>
          <span class="faint fs-11_5" th:text="${f.format} + (${f.sizeText} != null ? ' · ' + ${f.sizeText} : '')">HWPX · 417KB</span>
        </a>
        <details class="nf-more" th:if="${#lists.size(noticeFiles) > 1}">
          <summary th:text="'나머지 ' + ${#lists.size(noticeFiles) - 1} + '건 보기'">나머지 1건 보기</summary>
          <a class="nf-item" th:each="f, st : ${noticeFiles}" th:unless="${st.first}" title="눌러서 내려받기"
             th:href="@{/proposal/notice-file/{fs}(fs=${f.fileSn}, bid=${bid.pbancSn})}">
            <span class="nf-nm" th:text="${f.orgnlFileNm}">공고서.pdf</span>
            <span class="faint fs-11_5" th:text="${f.format} + (${f.sizeText} != null ? ' · ' + ${f.sizeText} : '')">PDF · 120KB</span>
          </a>
        </details>
      </div>
    </div>

    <!-- 탭: 제안서 목차·요구사항 / 제안요약서 목차 (FR-063) -->
    <div class="tabs">
      <a class="tab" th:classappend="${tab == 'prop'} ? 'on'" th:href="@{/proposal(bid=${bid.pbancSn})}">제안서 목차 · 요구사항</a>
      <a class="tab" th:classappend="${tab == 'sum'} ? 'on'" th:href="@{/proposal(bid=${bid.pbancSn}, tab='sum')}">제안요약서 목차</a>
    </div>

    <th:block th:if="${tab == 'prop'}"><th:block th:replace="~{proposal/tab-proposal :: tab}"></th:block></th:block>
    <th:block th:if="${tab == 'sum'}"><th:block th:replace="~{proposal/tab-summary :: tab}"></th:block></th:block>
    </div>
    </div>
  </th:block>
</th:block>

<th:block layout:fragment="scripts">
  <script th:src="@{/js/proposal.js}"></script>
</th:block>
</body>
</html>
