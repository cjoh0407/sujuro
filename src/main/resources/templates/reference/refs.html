<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<!--/*
  참고자료. 제안서를 쓸 때 쓰는 폰트·이미지·공유 자료를 같은 팀끼리 나누는 화면. 팀장·팀원만, 내 소속 팀의 자료만 보인다.
  모델: teamNm, files(이 페이지 자료), shown(조건에 맞는 전체 건수), page, totalPages, counts(구분별 건수), total, se(고른 구분), q(검색어), me, leader
*/-->
<head>
  <title>참고자료</title>
  <th:block layout:fragment="head">
    <meta name="async-forms" content="on"><!-- 이 화면의 폼은 새로고침 없이 저장한다 (js/async-form.js) -->
    <link rel="stylesheet" th:href="@{/css/proposal.css}"><!-- 끌어 놓기 칸(.drop) 모양을 제안서 파일 올리기와 같게 쓴다 -->
    <link rel="stylesheet" th:href="@{/css/refs.css}">
  </th:block>
</head>
<body>

<h1 layout:fragment="pageTitle">참고자료</h1>

<th:block layout:fragment="content">

  <div class="banner ok" data-flash="done" th:if="${done != null}" th:text="${done}">처리했습니다.</div>
  <div class="banner err" data-flash="error" th:if="${error != null}" th:text="${error}">오류 안내</div>
  <!-- 3:7 화면: 왼쪽에 자료 올리기 카드(제안 화면들과 같은 박스), 오른쪽에 자료 목록 -->
  <div class="split">
  <aside class="split-l">
    <div class="card" id="upCard">
      <div class="card-head">
        <h3>자료 올리기</h3>
        <span class="faint fs-11_5">최대 50MB</span>
      </div>
      <form th:action="@{/refs/upload}" method="post" enctype="multipart/form-data" class="pad mp-form">
        <input type="hidden" name="se" th:value="${se}">
        <label class="drop">
          <input type="file" name="file" required data-max-mb="50">
          <span class="ic ic-upload"></span>
          <span class="drop-body">
            <span class="drop-text"><span><b>파일 선택</b> · 끌어 놓기</span></span>
            <span class="drop-hint"></span>
          </span>
        </label>
        <label class="qa-side-l">
          <span class="row jc-between"><span>설명 (선택)</span><span class="faint fw-normal" id="refMemoCnt">0 / 30</span></span>
          <input type="text" name="memo" maxlength="30" placeholder="예: 제안서 본문용 고딕체"
                 oninput="document.getElementById('refMemoCnt').textContent = this.value.length + ' / 30'">
        </label>
        <div class="row jc-end">
          <button class="btn sm primary" type="submit">올리기</button>
        </div>
      </form>
    </div>
  </aside>
  <div class="split-r">

  <div class="card">
    <div class="card-head ref-head">
      <div class="tabs">
        <a class="tab" th:classappend="${se == ''} ? 'on'" th:href="@{/refs(q=${q})}" th:text="|전체 ${total}|">전체</a>
        <a class="tab" th:classappend="${se == 'RF010'} ? 'on'" th:href="@{/refs(se='RF010', q=${q})}" th:text="|폰트 ${counts['RF010']}|">폰트</a>
        <a class="tab" th:classappend="${se == 'RF020'} ? 'on'" th:href="@{/refs(se='RF020', q=${q})}" th:text="|이미지 ${counts['RF020']}|">이미지</a>
        <a class="tab" th:classappend="${se == 'RF030'} ? 'on'" th:href="@{/refs(se='RF030', q=${q})}" th:text="|문서 ${counts['RF030']}|">문서</a>
        <a class="tab" th:classappend="${se == 'RF040'} ? 'on'" th:href="@{/refs(se='RF040', q=${q})}" th:text="|기타 ${counts['RF040']}|">기타</a>
      </div>
      <form class="ref-search" th:action="@{/refs}" method="get">
        <input type="hidden" name="se" th:value="${se}">
        <input type="search" name="q" th:value="${q}" placeholder="파일 이름·설명 검색" aria-label="파일 이름·설명 검색">
        <button class="btn sm" type="submit">검색</button>
      </form>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(files)}"
         th:text="${total == 0} ? '아직 올린 자료가 없습니다. 위에서 첫 자료를 올려 보세요.' : '조건에 맞는 자료가 없습니다.'">자료가 없습니다.</div>

    <div class="ts" th:unless="${#lists.isEmpty(files)}">
      <table class="ref-table">
        <thead><tr><th class="c-pv"></th><th>파일</th><th class="c-se">구분</th><th class="c-sz">크기</th><th class="c-who">올린 사람</th><th class="c-dt">올린 날</th><th class="c-act"></th></tr></thead>
        <tbody>
          <tr class="hv" th:each="f : ${files}">
            <td class="c-pv">
              <img th:if="${f.previewable}" class="ref-thumb" th:src="@{/refs/view(refFileSn=${f.refFileSn})}" th:alt="${f.orgnlFileNm}" loading="lazy">
              <span th:unless="${f.previewable}" class="ref-doc" aria-hidden="true"><span class="ic ic-file"></span></span>
            </td>
            <td>
              <div class="ref-nm" th:text="${f.orgnlFileNm}" th:title="${f.orgnlFileNm}">파일명.ttf</div>
              <div class="ref-memo" th:if="${f.memoCn != null}" th:text="${f.memoCn}" th:title="${f.memoCn}">설명</div>
            </td>
            <td class="c-se"><span class="pill" th:text="${f.seNm}">폰트</span></td>
            <td class="c-sz" th:text="${f.sizeText}">120KB</td>
            <td class="c-who" th:text="${f.rgtrNm != null ? f.rgtrNm : f.rgtrId}">홍길동</td>
            <td class="c-dt" th:text="${#dates.format(f.regDt, 'yyyy-MM-dd')}">2026-11-03</td>
            <td class="c-act">
              <a class="ico" title="내려받기" aria-label="내려받기" th:href="@{/refs/download(refFileSn=${f.refFileSn})}"><span class="ic ic-download"></span></a>
              <form class="inl" th:if="${leader or f.rgtrId == me}" th:action="@{/refs/delete}" method="post"
                    onsubmit="return confirm('이 자료를 삭제할까요?');">
                <input type="hidden" name="refFileSn" th:value="${f.refFileSn}">
                <input type="hidden" name="se" th:value="${se}">
                <button class="ico danger" type="submit" title="삭제" aria-label="삭제"><span class="ic ic-trash"></span></button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pager" th:if="${totalPages > 1}">
      <a th:if="${page > 1}" aria-label="이전 페이지" th:href="@{/refs(se=${se}, q=${q}, page=${page - 1})}">&laquo;</a>
      <span class="off" th:unless="${page > 1}">&laquo;</span>
      <th:block th:each="p : ${#numbers.sequence(1, totalPages)}">
        <a th:classappend="${p == page} ? 'on' : ''" th:text="${p}" th:href="@{/refs(se=${se}, q=${q}, page=${p})}">1</a>
      </th:block>
      <a th:if="${page < totalPages}" aria-label="다음 페이지" th:href="@{/refs(se=${se}, q=${q}, page=${page + 1})}">&raquo;</a>
      <span class="off" th:unless="${page < totalPages}">&raquo;</span>
    </div>
  </div>
  </div>
  </div>

</th:block>

<th:block layout:fragment="scripts">
  <script th:src="@{/js/proposal.js}"></script><!-- 끌어 놓기·용량 확인 (proposal.js dropRender) -->
</th:block>

</body>
</html>
