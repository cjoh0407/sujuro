<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*
  사업별 결과 분석 (FR-080, 081, 087). UI 목업 v3.5 의 rArchive() 화면과 같은 구성이다.
  사업 이력 관리(stats/index) 오른쪽 칸이다. 왼쪽 목록에서 사업을 고르면 이 조각을 넣는다.
  경영지원실은 모든 개발팀, 팀장은 자기 팀 사업만 본다.
  11/04 아직 결과가 없는 사업(archive.pending. 진행 중·유찰)도 같은 자리에 보인다. 공고 기본 정보만 채우고 점수·평가 항목별 점수·장단점 칸 가운데에 안내 문구를 둔다.
  11/05 제출 산출물을 지웠다. 위 줄은 공고 기본 정보 | 점수, 그 아래 평가 항목별 점수와 장단점 분석은 넓게 쓴다.
  모두 읽기 화면이다. 결과·평가표는 경영지원실이, 평가 점수·장단점은 담당 팀 팀장이 평가·결과 입력(/results)에서 넣는다.

  모델: archive (result.dto.StatsArchiveDTO), canEdit (평가·결과 입력으로 가는 버튼)
*/-->
<body>

<th:block th:fragment="body">

  <!-- 사업 타이틀(사업명 · 평가·결과 입력 버튼)은 화면 맨 위 머리에 있다 (stats/index) -->

  <!--/* 컨소시엄 참여·하도급은 순위·점수·평가표를 받지 않아(11/04) 옆 칸 없이 공고 기본 정보만 넓게 보인다 */-->
  <div th:class="${archive.pending or !archive.manualResult} ? 'two even'">
    <div class="card">
      <div class="card-head"><h3>공고 기본 정보</h3></div>
      <div class="info-grid">
        <div><div class="k">수요기관</div><div class="v" th:text="${archive.instNm ?: '-'}">수요기관</div></div>
        <div><div class="k">참여 형태</div><div class="v" th:text="${archive.ptcpShpNm ?: '미지정'}">주관</div></div>
        <div><div class="k">수주 금액</div><div class="v" th:text="${archive.scsbdAmtText ?: '-'}">1.2억</div></div>
        <div><div class="k">담당 팀</div><div class="v" th:text="${archive.teamNm}">개발1팀</div></div>
        <div><div class="k">제출 마감</div>
          <div class="v" th:text="${archive.bidDdlnDt != null} ? ${#dates.format(archive.bidDdlnDt, 'yyyy-MM-dd')} : '-'">2026-09-24</div></div>
        <div><div class="k" th:text="${archive.pending} ? '진행 상태' : '결과'">결과</div>
          <div class="v"><b th:text="${archive.pending} ? ${archive.pbancSttsNm} : ${archive.resultText}">수주 · 1위</b></div></div>
      </div>
    </div>

    <!--/* 아직 결과가 없는 사업: 칸 가운데에 안내 문구 */-->
    <div class="card pending-card" th:if="${archive.pending}">
      <div class="card-head"><h3>점수</h3></div>
      <div class="pending-msg sm" th:text="${archive.pendingMessage}">아직 입찰 진행 중인 사업건입니다.</div>
    </div>

    <!--/* 사업 전체의 최종 성적. 나라장터 개찰 결과에서 가져온다. 만점은 공고의 기술·가격 배점(비율).
         카드 높이는 옆 공고 기본 정보에 맞추고, 점수 줄을 그 높이에 고르게 벌려 아래 빈 공간이 없게 한다 (.score-card).
         th:replace 는 th:unless 보다 먼저 돌아서 조건을 바깥에 둔다 */-->
    <th:block th:unless="${archive.pending or archive.manualResult}">
      <th:block th:replace="~{stats/fragments/result-parts :: scoreCard(${archive})}"></th:block>
    </th:block>
  </div>

  <div class="card pending-card" th:if="${archive.pending}">
    <div class="card-head"><h3>평가 항목별 점수</h3></div>
    <div class="pending-msg" th:text="${archive.pendingMessage}">아직 입찰 진행 중인 사업건입니다.</div>
  </div>

  <!--/* 평가 항목(대분류)별 점수 그래프 (11/05). 평가표 엑셀을 올린 업체마다 위원 평균 점수를 막대로 그리고, 항목마다 1등 막대만 진하다.
       종합 점수 1등 업체를 수주 업체로 보인다. 평가표 엑셀이 올라오기 전에는 비어 있다. 두 칸 폭을 쓴다 */-->
  <div class="card" th:unless="${archive.pending or archive.manualResult}">
    <div class="card-head">
      <h3>평가 항목별 점수</h3>
      <span class="faint fs-11_5" th:unless="${archive.articleTable.empty}">단위: 점 · 괄호는 배점</span>
    </div>
    <th:block th:replace="~{stats/fragments/result-parts :: articleChart(${archive.articleTable},
              '평가표 엑셀이 올라오지 않아 항목별 점수가 없습니다. 평가·결과 입력에서 올리면 다른 업체와 비교한 결과가 나옵니다.')}"></th:block>
  </div>

  <div class="card pending-card" th:if="${archive.pending}">
    <div class="card-head"><h3>분석 기록</h3></div>
    <div class="pending-msg sm" th:text="${archive.pendingMessage}">아직 입찰 진행 중인 사업건입니다.</div>
  </div>

  <!-- 장단점 분석 (FR-081). 담당 팀 팀장이 평가·결과 입력에서 적는다 -->
  <div class="card" th:unless="${archive.pending}">
    <div class="card-head">
      <h3>분석 기록</h3>
    </div>
    <div class="pad grid3 analysis">
      <div>
        <div class="lbl">강점</div>
        <div class="note" th:if="${archive.strptCn}" th:text="${archive.strptCn}">강점</div>
        <div class="note faint" th:unless="${archive.strptCn}">기록 없음</div>
      </div>
      <div>
        <div class="lbl">실주·감점 원인</div>
        <div class="note" th:if="${archive.sbptCsCn}" th:text="${archive.sbptCsCn}">감점 원인</div>
        <div class="note faint" th:unless="${archive.sbptCsCn}">기록 없음</div>
      </div>
      <div>
        <div class="lbl">차기 보완점</div>
        <div class="note" th:if="${archive.splmntCn}" th:text="${archive.splmntCn}">보완점</div>
        <div class="note faint" th:unless="${archive.splmntCn}">기록 없음</div>
      </div>
    </div>
  </div>

</th:block>

</body>
</html>
