<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*
  사업별 결과 분석(stats/fragments/archive)과 평가·결과 입력(results/index)이 같이 쓰는 조각. 인자 a = result.dto.StatsArchiveDTO
    scoreCard(a)      : 기술·가격·종합 점수 막대. 만점은 공고의 기술·가격 배점(비율), 없으면 90:10 으로 본다.
                        기술 원점수(차등점수제 적용 전)가 있으면 같이 보여 준다.
    evaluationFile(a) : 올린 평가표 엑셀 한 줄과 내려받기
    articleChart(t, emptyText) : 사업별 결과 분석의 평가 항목별 점수 그래프 (11/05, 표를 바꿨다). t = result.dto.ArticleScoreTableDTO.
                        x축은 평가 항목, 항목마다 평가표 엑셀을 올린 업체 수만큼 막대를 그린다. 항목마다 1등 막대만 진하고 나머지는 흐리다.
                        범례에 업체별 종합 점수·등수, 아래에 1등 업체(수주 업체)를 보여 준다. 항목별 등수는 막대에 마우스를 올리면 뜬다.
                        평가표 엑셀이 올라오기 전에는 비어 있고 emptyText 를 보인다. 카드에 바로 넣으므로 부르는 쪽은 .pad 로 감싸지 않는다.
*/-->
<body>

<div class="card score-card" th:fragment="scoreCard(a)">
  <div class="card-head">
    <h3>점수</h3>
    <span class="faint fs-11_5"
          th:text="${a.scoringText != null} ? |배점 ${a.scoringText}| : '개찰 결과에서 자동으로 가져옵니다'">배점 기술 90 : 가격 10</span>
  </div>
  <div class="pad">
    <div class="lossrow score" th:each="s : ${a.scores}">
      <b th:text="${s.label}">기술점수</b>
      <div class="bar"><i th:style="|width:${s.width}%|"></i></div>
      <span class="mono" th:text="${s.text}">0 / 90</span>
    </div>
  </div>
</div>

<div class="evl-file" th:fragment="evaluationFile(a)" th:if="${a.evaluationFile}" th:with="f=${a.evaluationFile}">
  <span class="faint" th:text="|평가표 ${f.orgnlFileNm} · ${f.rgtrNm ?: '-'}${f.regDt != null ? ' · ' + #dates.format(f.regDt, 'yyyy-MM-dd HH:mm') : ''}|">평가표</span>
  <a class="ico" title="내려받기" aria-label="내려받기" th:href="@{/bid-history/bids/{sn}/evaluation-file(sn=${a.pbancSn})}"><span class="ic ic-download"></span></a>
</div>

<!--/* 평가 항목별 점수 그래프 (11/05). 좌표는 ArticleScoreChartDTO 가 계산한다. viewBox 크기는 그 클래스의 WIDTH·HEIGHT 와 같다 */-->
<th:block th:fragment="articleChart(t, emptyText)">
  <th:block th:unless="${t.empty}" th:with="c=${t.chart}">
    <!--/* 범례: 막대 순서대로 업체, 종합 점수(항목 점수 합)와 등수 */-->
    <div class="co-legend">
      <span class="co-key" th:each="k : ${c.companies}" th:classappend="${k.ours} ? 'ours'">
        <i class="sw" th:classappend="${k.cls}"></i>
        <b th:if="${k.ours}" th:text="${k.coNm}">우리 회사</b>
        <span th:unless="${k.ours}" th:text="${k.coNm}">경쟁 업체</span>
        <span class="pill accent" th:if="${k.ours}">우리 회사</span>
        <span class="faint" th:text="|종합 ${k.totalText}점${k.totalRank != null ? ' · ' + k.totalRank + '등' : ''}|">종합 94.6점 · 1등</span>
      </span>
    </div>
    <div class="pad">
      <svg class="score-chart" viewBox="0 0 760 300" role="img" th:attr="aria-label=${c.ariaLabel}">
        <g th:each="g : ${c.gridLines}">
          <line class="grid" th:x1="${c.axisLeft}" th:x2="${c.axisRight}" th:y1="${g.y}" th:y2="${g.y}"></line>
          <text class="tick" th:x="${c.tickX}" th:y="${g.y}" dy="3" text-anchor="end" th:text="${g.label}">0</text>
        </g>
        <!--/* --gi: 항목 순서. 사업 이력 관리에서 막대가 항목 순서대로 차례로 자라게 한다 (stats.css) */-->
        <g th:each="g, gs : ${c.groups}" th:style="|--gi:${gs.index}|">
          <g class="co-bar" th:each="b : ${g.bars}" th:classappend="${b.first} ? 'first'">
            <title th:text="${b.title}">업체 · 항목 0 / 0</title>
            <rect class="hit" th:x="${b.hitX}" th:y="${b.hitY}" th:width="${b.hitWidth}" th:height="${b.hitHeight}"></rect>
            <path th:unless="${#strings.isEmpty(b.path)}" th:class="${b.cls}" th:attr="d=${b.path}"></path>
            <text class="val" th:if="${b.value}" th:x="${b.labelX}" th:y="${b.labelY}" text-anchor="middle" th:text="${b.value}">0</text>
          </g>
          <g>
            <title th:text="|${g.catNm} (배점 ${g.maxText})|">항목 (배점 0)</title>
            <text text-anchor="middle" th:y="${c.nameY}">
              <tspan class="nm" th:each="l, st : ${g.nameLines}" th:x="${g.labelX}" th:attr="dy=${st.first} ? 0 : 14" th:text="${l}">항목</tspan>
              <tspan class="mx" th:x="${g.labelX}" dy="14" th:text="|(${g.maxText})|">(0)</tspan>
            </text>
          </g>
        </g>
      </svg>
    </div>
  </th:block>
  <!--/* 그래프 아래 수주 업체(종합 점수 1등). 줄 전체에 연한 초록을 칠한다 */-->
  <div class="evl-win" th:if="${t.winnerNm}">
    <span class="faint">수주 업체</span>
    <b th:text="${t.winnerNm}">우리 회사</b>
    <span class="faint" th:text="|종합 점수 1등 · ${t.winnerTotalText}점|">종합 점수 1등 · 94.6점</span>
  </div>
  <div class="empty" th:if="${t.empty}" th:text="${emptyText}">평가표 엑셀을 올리면 결과가 나옵니다.</div>
</th:block>

</body>
</html>
