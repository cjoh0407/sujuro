<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*
  사업별 결과 분석(stats/fragments/archive)과 평가·결과 입력(results/index)이 같이 쓰는 조각. 인자 a = result.dto.StatsArchiveDTO
    scoreCard(a)      : 기술·가격·종합 점수 막대. 만점은 공고의 기술·가격 배점(비율), 없으면 90:10 으로 본다.
                        기술 원점수(차등점수제 적용 전)가 있으면 같이 보여 준다.
    evaluationFile(a) : 올린 평가표 엑셀 한 줄과 내려받기
    articleTable(t, emptyText) : 사업별 결과 분석의 평가 항목별 점수 표 (11/03). t = result.dto.ArticleScoreTableDTO.
                        평가표 엑셀을 올린 업체가 열이고, 항목별 점수·등수, 종합 점수·등수, 1등 업체(수주 업체)를 보여 준다.
                        평가표 엑셀이 올라오기 전에는 비어 있고 emptyText 를 보인다. 표를 바로 넣으므로 부르는 쪽은 .pad 로 감싸지 않는다.
    barChart(c, teamSn) : 통계 전체 종합의 연도별 막대 차트 (11/05). c = result.dto.StatsChartDTO. 좌표는 StatsChartDTO 가 계산한다.
                        연도 묶음(.yg)은 그 연도 통계로 가는 링크이고 고른 연도만 선명하다. 누르면 stats/index 스크립트가 페이지를 새로 열지 않고 바꾼다.
*/-->
<body>

<svg class="chart" viewBox="0 0 300 210" role="group" th:fragment="barChart(c, teamSn)" th:attr="aria-label=${c.ariaLabel}">
  <g th:each="g : ${c.gridLines}">
    <line class="grid" th:x1="${c.axisLeft}" th:x2="${c.axisRight}" th:y1="${g.y}" th:y2="${g.y}"></line>
    <text class="tick" th:x="${c.tickX}" th:y="${g.y}" dy="3" text-anchor="end" th:text="${g.label}">0</text>
  </g>
  <a class="yg" th:each="yg : ${c.groups}" th:classappend="${yg.selected} ? 'on'" th:href="@{/stats(team=${teamSn}, year=${yg.year})}"
     th:attr="data-year=${yg.year},aria-label=|${yg.label} 보기|,aria-current=${yg.selected} ? 'true'">
    <g class="bar" th:each="b : ${yg.bars}">
      <title th:text="${b.title}">2026년 참여 0건</title>
      <rect class="hit" th:x="${b.hitX}" th:y="${b.hitY}" th:width="${b.hitWidth}" th:height="${b.hitHeight}"></rect>
      <path th:unless="${#strings.isEmpty(b.path)}" th:class="${b.cls}" th:attr="d=${b.path}"></path>
      <text class="val" th:x="${b.labelX}" th:y="${b.labelY}" text-anchor="middle" th:text="${b.value}">0</text>
    </g>
    <text class="yr" th:x="${yg.labelX}" th:y="${c.yearLabelY}" text-anchor="middle" th:text="${yg.label}">2026년</text>
  </a>
</svg>

<div class="card score-card" th:fragment="scoreCard(a)">
  <div class="card-head">
    <h3>점수</h3>
    <span class="faint" style="font-size:11.5px"
          th:text="${a.scoringText != null} ? |배점 ${a.scoringText}| : '개찰 결과에서 자동으로 가져옵니다'">배점 기술 90 : 가격 10</span>
  </div>
  <div class="pad">
    <div class="lossrow score" th:each="s : ${a.scores}">
      <b th:text="${s.label}">기술점수</b>
      <div class="bar"><i th:style="|width:${s.width}%|"></i></div>
      <span class="mono" th:text="${s.text}">0 / 90</span>
    </div>
  </div>
</div>

<div class="evl-file" th:fragment="evaluationFile(a)" th:if="${a.evaluationFile}" th:with="f=${a.evaluationFile}">
  <span>📊</span>
  <span class="faint" th:text="|평가표 ${f.orgnlFileNm} · ${f.rgtrNm ?: '-'}${f.regDt != null ? ' · ' + #dates.format(f.regDt, 'yyyy-MM-dd HH:mm') : ''}|">평가표</span>
  <a class="btn sm" th:href="@{/stats/bids/{sn}/evaluation-file(sn=${a.pbancSn})}">내려받기</a>
</div>

<!-- 평가 항목별 점수 표 (11/03). 업체가 열, 평가 항목(대분류)이 행. 칸은 위원 평균 점수와 그 항목 등수.
     맨 아래 줄은 종합 점수(항목 점수 합)와 등수, 표 아래는 종합 점수 1등 업체를 수주 업체로 보여 준다 (ArticleScoreTableDTO) -->
<th:block th:fragment="articleTable(t, emptyText)">
  <div class="ts" th:unless="${t.empty}">
    <table class="article-table">
      <thead>
        <tr>
          <th>평가 항목 (배점)</th>
          <th th:each="c : ${t.columns}" th:text="${c.coNm}"></th>
        </tr>
      </thead>
      <tbody>
        <tr class="hv" th:each="r : ${t.rows}">
          <td><span th:text="${r.catNm}">기술 및 기능</span> <span class="faint" th:text="|(${r.maxText})|">(30)</span></td>
          <td class="mono" th:each="x : ${r.cells}">
            <span th:text="${x.text}">28.2</span>
            <span class="rank" th:if="${x.rank}" th:text="|${x.rank}등|">1등</span>
          </td>
        </tr>
        <tr class="sum">
          <td><b>종합 점수</b> <span class="faint" th:text="|(${t.maxTotalText})|">(100)</span></td>
          <td class="mono" th:each="c : ${t.columns}">
            <b th:text="${c.totalText}">94.6</b>
            <span class="rank" th:if="${c.totalRank}" th:text="|${c.totalRank}등|">1등</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- 11/03 평가표 엑셀 내려받기 자리에 수주 업체(종합 점수 1등)를 둔다. 줄 전체에 연한 초록을 칠한다 -->
  <div class="evl-win" th:if="${t.winnerNm}">
    <span class="faint">수주 업체</span>
    <b th:text="${t.winnerNm}">우리 회사</b>
    <span class="faint" th:text="|종합 점수 1등 · ${t.winnerTotalText}점|">종합 점수 1등 · 94.6점</span>
  </div>
  <div class="empty" th:if="${t.empty}" th:text="${emptyText}">평가표 엑셀을 올리면 결과가 나옵니다.</div>
</th:block>

</body>
</html>
