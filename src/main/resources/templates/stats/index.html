<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<!--/*
  사업 이력 관리 (11/05). 통계(요약 카드·차트·수주율·경쟁 업체)를 지우고 새로 만든 탭이다.
  스토리보드 관리·제안서 파일 화면과 같은 3:7 양식이다(proposal.css 의 .split, .bid-item 을 같이 쓴다).
    왼쪽  : 사업 목록 블록: 제목 줄 오른쪽의 연도·팀 드롭다운 → 고른 연도·팀의 사업. 경영지원실은 연도와 팀, 팀장은 연도만 고른다.
            사업은 진행 중(view.inProgress)이 먼저이고 지난 사업(view.history. 결과 등록·유찰)이 이어진다.
            드롭다운을 바꾸면 페이지를 새로 열지 않고 머리와 본문만 바꾼다(맨 아래 스크립트).
    오른쪽: 고른 사업의 사업별 결과 분석(stats/fragments/archive). 고르지 않았으면 제안 화면처럼 목록 맨 위 사업을 보여 준다.
            아직 결과가 없으면 공고 기본 정보와 안내 문구만 보인다.

  모델: view (result.dto.StatsViewDTO), archive·canEdit (볼 사업이 있을 때만)
*/-->
<head>
  <title>사업 이력 관리</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" th:href="@{/css/proposal.css}"><!-- 3:7 배치(.split)와 목록(.bid-item) 모양을 제안 화면과 같게 쓴다 -->
    <link rel="stylesheet" th:href="@{/css/stats.css}">
  </th:block>
</head>
<body>

<h1 layout:fragment="pageTitle">사업 이력 관리</h1>

<th:block layout:fragment="content">

  <!-- 머리: 보고 있는 사업명(NFR-023). 볼 사업이 없으면 탭 이름과 팀 · 연도 -->
  <div class="page-head" th:unless="${view.locked}">
    <div th:if="${archive}">
      <h2 th:text="${archive.pbancNm}">사업명</h2>
    </div>
    <div th:unless="${archive}">
      <h2>사업 이력 관리</h2>
      <div class="sub" th:text="|${view.teamNm} · ${view.year}년|">개발1팀 · 2026년</div>
    </div>
    <div class="row" th:if="${archive}">
      <a class="btn sm" th:if="${canEdit}" th:href="@{/results(bid=${archive.pbancSn})}">평가·결과 입력</a>
    </div>
  </div>


  <!-- 개발팀이 아닌 팀장 등 볼 팀이 없을 때 -->
  <div class="card" th:if="${view.locked}">
    <div class="lock"><b th:text="${view.lockMessage}">사업 이력은 개발팀 단위로 제공됩니다.</b></div>
  </div>

  <!--/* hist-view: 이 화면에서만 열 때 효과를 준다 (stats.css). 같은 조각을 쓰는 평가·결과 입력 화면은 움직이지 않는다 */-->
  <div class="split hist-view" th:unless="${view.locked}">

  <!-- 왼쪽 3: 볼 사업 고르기. 제안 화면의 사업건 목록과 같은 블록이다. 누르면 오른쪽이 바뀐다 -->
  <aside class="split-l">
    <div class="card">
      <!--/* 드롭다운은 제목 줄 오른쪽에 둔다. 고르면 바로 그 연도·팀의 사업으로 바뀐다(맨 아래 스크립트). 팀장은 자기 팀만 보므로 팀 칸이 없다 */-->
      <div class="card-head scope-head">
        <h3>사업 목록</h3>
        <form class="scope-form" method="get" th:action="@{/bid-history}">
          <select id="sc-year" name="year" aria-label="연도" title="입찰 마감일 기준 연도">
            <option th:each="y : ${view.years}" th:value="${y}" th:text="|${y}년|" th:selected="${y == view.year}">2026년</option>
          </select>
          <select id="sc-team" name="team" aria-label="팀" th:if="${#lists.size(view.teams) > 1}">
            <option th:each="t : ${view.teams}" th:value="${t.teamSn}" th:text="${t.teamNm}"
                    th:selected="${t.teamSn == view.teamSn}">개발1팀</option>
          </select>
        </form>
      </div>
      <div class="bid-list">
        <div class="bid-body year-body">
          <a class="bid-item" th:each="p : ${view.inProgress}" th:href="@{/bid-history(team=${view.teamSn}, year=${view.year}, bid=${p.pbancSn})}"
             th:classappend="${archive != null and archive.pbancSn == p.pbancSn} ? 'on'">
            <b th:title="${p.pbancNm}" th:text="${p.pbancNm}">사업명</b>
            <span class="pill neutral" th:text="${p.pbancSttsNm}">제안 작성 중</span>
          </a>
          <a class="bid-item" th:each="h : ${view.history}" th:href="@{/bid-history(team=${view.teamSn}, year=${view.year}, bid=${h.pbancSn})}"
             th:classappend="${archive != null and archive.pbancSn == h.pbancSn} ? 'on'">
            <b th:title="${h.pbancNm}" th:text="${h.pbancNm}">사업명</b>
            <span class="pill" th:classappend="${h.won} ? 'success' : 'neutral'" th:text="${h.pillText}">수주</span>
          </a>
          <div class="empty" th:if="${#lists.isEmpty(view.inProgress) and #lists.isEmpty(view.history)}"
               th:text="|${view.year}년 진행 사업이 없습니다.|">진행 사업이 없습니다.</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 오른쪽 7: 사업별 결과 분석 -->
  <div class="split-r" th:if="${archive}">
    <th:block th:replace="~{stats/fragments/archive :: body}"></th:block>
  </div>

  <!-- 오른쪽 7: 고른 연도·팀에 사업이 없을 때 -->
  <div class="split-r" th:unless="${archive}">
    <div class="card pending-card">
      <div class="pending-msg" th:text="|${view.year}년 ${view.teamNm} 사업이 없습니다.|">사업이 없습니다.</div>
    </div>
  </div>

  </div>

</th:block>

<th:block layout:fragment="scripts">
<script th:src="@{/js/stats.js}"></script>
</th:block>

</body>
</html>
