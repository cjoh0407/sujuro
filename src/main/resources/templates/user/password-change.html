<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 - 수주로</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
</head>
<body>
<!--/* 비밀번호 변경 화면 (FR-002-2). 헤더 내 정보 팝업의 [비밀번호 변경]에서 들어온다. 모양은 초기 비밀번호 변경 화면과 같고,
     현재 비밀번호 칸이 하나 더 있다. 변경해도 로그인은 그대로 유지된다. */-->
<div class="login">
  <aside th:replace="~{login :: side}"></aside>

  <main class="login-main">
    <div class="login-form is-pw">
      <div class="login-mobile-brand">
        <svg class="brand-logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><path d="M46 14C22 8 18 29 32 32C46 35 42 56 18 50" fill="none" stroke="var(--logo-n)" stroke-width="8" stroke-linecap="round"/><circle cx="46" cy="14" r="6.5" fill="var(--logo-r)"/><circle cx="18" cy="50" r="6.5" fill="var(--logo-g)"/></svg>
        <b>수주로</b>
      </div>
      <div>
        <h1>비밀번호 변경</h1>
        <div class="login-sub">현재 비밀번호를 확인한 뒤<br>새 비밀번호로 바꿉니다.</div>
      </div>

      <div class="login-msg ok" role="status" th:if="${done != null}"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 8.2l2 2 3.6-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>비밀번호를 변경했습니다.</div>
      <div class="login-msgs" role="alert" th:if="${errors != null}">
        <div class="login-msg err" th:each="e : ${errors}"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6v4.2M8 11.2v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span th:text="${e}">오류 안내</span></div>
      </div>

      <form th:if="${done == null}" th:action="@{/password/change}" method="post" class="login-fields">
        <div class="fld">
          <label for="currentPassword">현재 비밀번호</label>
          <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" autofocus required>
        </div>
        <div class="fld">
          <label for="newPassword">새 비밀번호</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="fld">
          <label for="confirmPassword">새 비밀번호 확인</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="login-help">8자 이상, 영문·숫자·특수문자 모두 포함 (현재 비밀번호 사용 불가)</div>
        <button class="btn primary login-btn" type="submit">변경하기</button>
      </form>

      <a class="btn primary login-btn" th:if="${done != null}" th:href="@{/dashboard}">대시보드로</a>
      <div class="login-logout" th:if="${done == null}"><a th:href="@{/dashboard}">취소</a></div>
    </div>
  </main>
</div>
</body>
</html>
