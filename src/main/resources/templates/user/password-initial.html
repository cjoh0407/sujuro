<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 - 수주로</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<!--/* 초기 비밀번호 강제 변경 화면 (FR-002). 사이드바 없이 이 화면만 보여 준다. */-->
<div class="center-screen">
  <div class="box">
    <div class="card">
      <div class="pad" style="display:flex;flex-direction:column;gap:14px">
        <div>
          <b style="font-size:17px">비밀번호를 변경해 주세요</b>
          <div class="sub">초기 비밀번호로 로그인했습니다. 새 비밀번호로 바꾸기 전에는 다른 화면을 쓸 수 없습니다.</div>
        </div>

        <div class="banner err" th:if="${errors != null}">
          <ul style="margin:0;padding-left:18px">
            <li th:each="e : ${errors}" th:text="${e}">오류 안내</li>
          </ul>
        </div>

        <form th:action="@{/password/initial}" method="post" style="display:flex;flex-direction:column;gap:12px">
          <div class="fld">
            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" autofocus required>
          </div>
          <div class="fld">
            <label for="confirmPassword">새 비밀번호 확인</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
          </div>
          <div class="faint" style="font-size:11.5px">8자 이상, 영문·숫자·특수문자를 모두 섞어 주세요. 초기 비밀번호와 같을 수 없습니다.</div>
          <button class="btn primary" type="submit" style="justify-content:center">변경하기</button>
        </form>

        <form th:action="@{/logout}" method="post" style="text-align:center">
          <button class="btn sm" type="submit">로그아웃</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
