<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
  <title>내 정보</title>
</head>
<body>

<h1 layout:fragment="pageTitle">내 정보</h1>

<th:block layout:fragment="content">
  <div class="card">
    <div class="card-head"><h3>기본 정보</h3></div>
    <div class="info-grid">
      <div><div class="k">이름</div><div class="v" sec:authentication="principal.name">이름</div></div>
      <div><div class="k">사번</div><div class="v" sec:authentication="principal.empNo">사번</div></div>
      <div><div class="k">소속</div><div class="v" sec:authentication="principal.team">소속</div></div>
      <div><div class="k">직급</div><div class="v" sec:authentication="principal.rank">직급</div></div>
      <div><div class="k">권한</div><div class="v" sec:authentication="principal.roleLabel">권한</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="card-head"><h3>비밀번호 변경</h3></div>
    <div class="pad" style="display:flex;flex-direction:column;gap:12px;max-width:420px">

      <div class="banner ok" th:if="${done != null}">비밀번호를 변경했습니다.</div>
      <div class="banner err" th:if="${errors != null}">
        <ul style="margin:0;padding-left:18px">
          <li th:each="e : ${errors}" th:text="${e}">오류 안내</li>
        </ul>
      </div>

      <form th:action="@{/profile/password}" method="post" style="display:flex;flex-direction:column;gap:12px">
        <div class="fld">
          <label for="currentPassword">현재 비밀번호</label>
          <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="fld">
          <label for="newPassword">새 비밀번호</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="fld">
          <label for="confirmPassword">새 비밀번호 확인</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="faint" style="font-size:11.5px">8자 이상, 영문·숫자·특수문자를 모두 섞어 주세요. 현재 비밀번호와 같을 수 없습니다.</div>
        <div><button class="btn primary" type="submit">변경하기</button></div>
      </form>
    </div>
  </div>
</th:block>

</body>
</html>
